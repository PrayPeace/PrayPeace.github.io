<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음거리 3회차 이름 고르기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* VOICE: 2학년 교실 칠판 앞, 다정하고 크게
   IDEA: 교실 출석 이름표 판 — 내 이름표 하나를 톡 누른다
   PICTURE: 18장의 큰 이름표 버튼이 곧 화면
   COLOUR and TYPE: 크림색 바탕, 초록 칠판 띠, 주황 번호 / Jua 제목, Noto Sans KR 본문
   LAYOUT: 짧은 안내 띠 + 이름표 3~6열 격자, 태블릿 가로·세로 모두 */
:root{color-scheme:light dark;--bg:light-dark(#fff8ea,#1d2420);--ink:light-dark(#1f2a24,#f3efe4);--board:light-dark(#2f6b4f,#25543e);--card:light-dark(#ffffff,#2a332e);--line:light-dark(#e6dcc6,#3d4a43);--num:#e8590c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
header{background:var(--board);color:#fff;padding:22px max(4vw,16px) 20px}
h1{font:400 clamp(30px,5vw,44px)/1.1 "Jua",sans-serif;margin:0 0 6px;text-wrap:balance}
header p{margin:0;font-size:17px;opacity:.92}
main{padding:22px max(4vw,16px) 40px;max-width:1240px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.grid a{display:flex;align-items:center;gap:12px;min-height:84px;padding:12px 16px;background:var(--card);border:2px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.grid a:active{transform:translateY(3px);box-shadow:none}
.grid a:focus-visible{outline:3px solid var(--num);outline-offset:2px}
.n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--num);color:#fff;display:grid;place-items:center;font:400 22px "Jua",sans-serif}
.nm{font:400 28px/1 "Jua",sans-serif}
.tip{margin:22px 0 0;padding:12px 16px;border-radius:12px;background:light-dark(#fff1c9,#3a3524);font-size:16px}
@media(prefers-reduced-motion:reduce){.grid a{transition:none}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nm{font-size:24px}}
</style>
</head>
<body>
<header>
  <h1>마음거리 검사 3회차</h1>
  <p>내 번호와 이름을 찾아서 한 번만 눌러요.</p>
</header>
<main>
  <div class="grid" id="g"></div>
  <p class="tip">다른 친구 이름은 누르지 않아요. 잘못 눌렀으면 그대로 멈추고 손을 들어요.</p>
</main>
<script>
{
const st=[[1,'김ㅇ준','AYAK'],[2,'김ㅇ백','2DLV'],[3,'김ㅇ율','9SX9'],[4,'박ㅇ형','EJML'],[5,'박ㅇ하','NDNE'],[6,'방ㅇ호','G5MS'],[7,'방ㅇ율','89CR'],[8,'송ㅇ완','ZO34'],[9,'양ㅇ영','P3TQ'],[10,'유ㅇ나','7FGA'],[11,'유ㅇ현','XOIQ'],[12,'윤ㅇ린','JF3J'],[13,'이ㅇ이','FPRI'],[14,'장ㅇ현','EMUK'],[15,'전ㅇ원','5QDO'],[16,'최ㅇ한','DGBA'],[17,'기ㅇ현','FG5Y'],[18,'김ㅇ안','Z001']];
/* 이름은 가운데 글자를 가렸어요 */
const base='https://www.classify.co.kr/test-for-student?code=';
document.getElementById('g').innerHTML=st.map(([n,nm,c])=>`<a href="${base}${encodeURIComponent('카나리아'+c)}" target="_blank" rel="noopener"><span class="n">${n}</span><span class="nm">${nm}</span></a>`).join('');
}
</script>
</body>
</html>
